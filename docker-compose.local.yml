# Stack local (sem homelab/cloudflared/nginx).
# Uso: docker compose -f docker-compose.local.yml up --build
name: adoracao-local

services:
  api:
    build: .
    container_name: adoracao-api-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3333
      SQL_HOST: mysql
      SQL_PORT: 3306
      SQL_DB: ${SQL_DB:-adoracao_db}
      # The local MySQL container provisions a regular application user.
      # Do not pass SQL_USER=root through from a developer .env file.
      SQL_USER: adoracao_user
      SQL_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-adoracao_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "3333:3333"
    networks:
      - adoracao-net

  mongo:
    image: mongo:7
    container_name: adoracao-mongo-local
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - adoracao-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8
    container_name: adoracao-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_senha
      MYSQL_DATABASE: ${SQL_DB:-adoracao_db}
      MYSQL_USER: adoracao_user
      MYSQL_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    networks:
      - adoracao-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mongo_data:
  mysql_data:

networks:
  adoracao-net:
